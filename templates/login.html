{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 p-4 bg-white">

                <!-- Cabeçalho do Card -->
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-success">EcoView</h3>
                    <p class="text-muted small">Sistema de Monitoramento de Ecotecnologias</p>
                </div>

                <!-- Formulário de Login -->
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary fw-semibold small">Usuário</label>
                        <input type="text" name="username" id="username" class="form-control form-control-lg bg-light border-0" placeholder="Digite seu usuário" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary fw-semibold small">Senha</label>
                        <input type="password" name="password" id="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">Entrar</button>
                    </div>

                    <div class="text-center">
                        <a href="{% url 'register' %}" class="text-decoration-none small text-muted">Não tem cadastro? <span class="text-success fw-semibold">Clique aqui</span></a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
