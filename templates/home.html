{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 75vh;">
    <div class="card border-0 shadow-lg rounded-4 p-5 bg-white text-center" style="max-width: 700px; width: 100%;">
        <h2 class="fw-bold mb-2" style="color: #03a75a;">Bem-vindo ao EcoView</h2>
        <p class="text-muted mb-4 small">Selecione uma das opções abaixo para visualizar as informações do sistema:</p>

        <div class="row g-3 justify-content-center">
            <div class="col-md-6">
                <a href="{% url 'select_dashboard' %}" class="card text-decoration-none border-2 p-4 h-100 shadow-sm" style="border-color: #02aeee !important; border-radius: 14px; transition: all 0.3s;">
                    <div class="card-body text-center">
                        <div class="mb-3 mx-auto d-flex align-items-center justify-content-center rounded-circle" style="width: 55px; height: 55px; background: rgba(2, 174, 238, 0.15); color: #02aeee; font-size: 24px;">
                            <i class="bi bi-speedometer2"></i>
                        </div>
                        <h5 class="fw-bold text-dark mb-1">Dashboards</h5>
                        <p class="text-muted small mb-0">Gráficos e métricas de sensores em tempo real</p>
                    </div>
                </a>
            </div>

            <div class="col-md-6">
                <a href="{% url 'select_table' %}" class="card text-decoration-none border-2 p-4 h-100 shadow-sm" style="border-color: #a8ce46 !important; border-radius: 14px; transition: all 0.3s;">
                    <div class="card-body text-center">
                        <div class="mb-3 mx-auto d-flex align-items-center justify-content-center rounded-circle" style="width: 55px; height: 55px; background: rgba(168, 206, 70, 0.2); color: #03a75a; font-size: 24px;">
                            <i class="bi bi-table"></i>
                        </div>
                        <h5 class="fw-bold text-dark mb-1">Tabelas de Dados</h5>
                        <p class="text-muted small mb-0">Consulta detalhada de registros e histórico</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
