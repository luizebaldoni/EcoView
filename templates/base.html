<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Monitoramentos do Ecotecnologias{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    {% load static %}

    <!-- Global CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/chart.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/battery.css' %}">

    <!-- Compatibilidade com bloco antigo `style` e novo `extra_css` -->
    {% block style %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Main content area (padronizado) -->
    <main class="page-content container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Site footer -->
    <footer class="site-footer">
        <div class="container text-center py-3">
            <div class="row align-items-center">
                <div class="col-md-6 text-md-start mb-2 mb-md-0">
                    <small class="text-muted">&copy; {{ now|date:"Y" }} Grupo de Modelagem HidroAmbiental e Ecotecnologias UFSM</small>
                </div>
                <div class="col-md-6 text-md-end">
                    <small class="text-muted">EcoMonitoramentos • Versão: 1.0</small>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
    // marca o link de navegação ativo conforme a URL atual
    (function(){
        try{
            const links = document.querySelectorAll('.site-header .nav-link');
            const path = window.location.pathname.replace(/\/+$/,'');
            links.forEach(a=>{
                const href = a.getAttribute('href');
                if(!href) return;
                // tenta resolver URLs relativas
                try{
                    const url = new URL(href, window.location.origin);
                    const hrefPath = url.pathname.replace(/\/+$/,'');
                    if(hrefPath === path){
                        a.classList.add('active');
                        a.setAttribute('aria-current','page');
                    }
                }catch(e){
                    // ignora
                }
            });
        }catch(e){
            console.warn('Nav active script error', e);
        }
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
